services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bedmed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bedmed}
      POSTGRES_DB: ${POSTGRES_DB:-bedmed}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    image: bedmed
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bedmed}:${POSTGRES_PASSWORD:-bedmed}@db:5432/${POSTGRES_DB:-bedmed}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 15

  # The chat client. It is given the API's URL and an LLM key, and no database credentials.
  # Start it with: docker compose run --rm assistant
  assistant:
    image: bedmed
    profiles: ["chat"]
    command: ["python", "-m", "assistant"]
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      BEDMED_MODEL: ${BEDMED_MODEL:-}
      BEDMED_API_URL: http://api:8000
    volumes:
      - .:/app
    stdin_open: true
    tty: true
    depends_on:
      api:
        condition: service_healthy
