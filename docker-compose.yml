services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bedmed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bedmed}
      POSTGRES_DB: ${POSTGRES_DB:-bedmed}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bedmed}:${POSTGRES_PASSWORD:-bedmed}@db:5432/${POSTGRES_DB:-bedmed}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
